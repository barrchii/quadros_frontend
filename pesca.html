<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quadros Gallery</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://use.typekit.net/tys4vyn.css">
  <link rel="icon" href="images/favicon.ico" />
</head>

<body>

  <header>
    <div class="header-left">
      <button class="hamburger" aria-label="Open menu" onclick="openNav()">
        <img src="icons/hamburger.svg" alt="hamburger" width="40" height="40" />
      </button>
      <a href="index.html">Quadros</a>
    </div>
    <div class="header-right">
      <a href="lore.html" onclick="closeNav()">lore</a>
      <a href="https://instagram.com/yourhandle" onclick="closeNav()" target="_blank">instagram</a>
      <a href="mailto:your@email.com" aria-label="email" onclick="closeNav()">email</a>
      <a href="account.html" onclick="closeNav()">account</a>
      <button onclick="openCart()">cart</button>
    </div>
  </header>

  <div class="horizontal-rule">
    <hr>
  </div>

  <div class="nav-drawer" id="navDrawer">
    <div class="nav-drawer-overlay" onclick="closeNav()"></div>
    <div class="nav-drawer-panel">
      <button class="nav-drawer-close" onclick="closeNav()">&#x2715;</button>
      <div class="nav-drawer-links">
        <a href="lore.html">lore</a>
        <a href="https://instagram.com/yourhandle" target="_blank">instagram</a>
        <a href="mailto:your@email.com" aria-label="email">email</a>
        <a href="account.html">account</a>
      </div>
    </div>
  </div>

  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-drawer-overlay" onclick="closeCart()"></div>
    <div class="cart-drawer-panel">
      <div class="cart-drawer-header">
        <button class="cart-drawer-close" onclick="closeCart()">&#x2715;</button>
      </div>
      <div class="cart-empty">Your cart is empty.</div>
    </div>
  </div>

  <main class="print-page" data-print="pesca" data-title="Pesca">
    <img src="" alt="Pesca" class="print-image" id="photo"/>

    <div class="options">

      <div class="description">
        <h3>Pesca | 2020</h3>
      </div>

      <div class="option-group">
        <select id="size">
          <option value="medium">Medium (12x18")</option>
          <option value="large">Large (20x30")</option>
        </select>
      </div>

      <div class="option-group">
        <select id="frame">
          <option value="none">No Frame</option>
          <option value="black" selected>Black Frame</option>
          <option value="wood">Natural Wood Frame</option>
        </select>
      </div>

      <div class="purchase">
        <span id="price"></span>
        <div class="buttons">
          <button>Buy now</button>
          <button>Add to cart</button>
        </div>
      </div>

    </div>
    
  </main>

  <script src="print.js"></script>

  <script src="cart.js"></script>

  <script>
    function openNav()  { document.getElementById('navDrawer').classList.add('open'); }
    function closeNav() { document.getElementById('navDrawer').classList.remove('open'); }
    function openCart()  { document.getElementById('cartDrawer').classList.add('open'); }
    function closeCart() { document.getElementById('cartDrawer').classList.remove('open'); }
  </script>

</body>
</html>

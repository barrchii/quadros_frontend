<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quadros Gallery</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://use.typekit.net/tys4vyn.css">
  <link rel="icon" href="images/favicon.ico" />
</head>
<body>

  <header>
    <div class="header-left-solo">
      <a href="index.html" class="header-logo">Quadros</a>
    </div>
  </header>

  <div class="horizontal-rule">
    <hr>
  </div>

  <main class="account-page">
    <div class="login">
      <label>Thank you for your order! An email was sent with your confirmation.</label>
      <a href="index.html"><button>Back to gallery</button></a>
    </div>
  </main>

  <script>
    const API_BASE = window.location.hostname === '127.0.0.1'
    ? 'http://127.0.0.1:8000'
    : 'https://api.quadrosgallery.com';

    fetch(`${API_BASE}/api/cart/clear/`, {
      method: 'POST',
      credentials: 'include',
    });

  </script>

</body>
</html>
